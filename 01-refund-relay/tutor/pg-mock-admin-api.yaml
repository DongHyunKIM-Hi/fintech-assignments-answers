openapi: 3.1.0
info:
  title: 가상 결제대행사 평가 전용 API (비공개, 내부용)
  version: 1.1.0
  description: |
    튜터가 수강생 제출물을 직접 실행해 검증할 때 쓰는 API다. 수강생에게는 공개하지 않는다 (Swagger에도 노출 안 함).
    가장 큰 쓸모는 "실패/지연 상황을 기다리지 않고 원할 때 재현"하는 것이다. 이게 없으면 튜터가 재시도 로직을
    확인하려고 무작위 실패가 나올 때까지 여러 번 요청을 반복해야 한다.
    기본 비활성(ADMIN_ENABLED=false)이고, 수강생용 compose.yaml에는 이 설정을 넣지 않는다.
    보안 토큰은 두지 않는다 — 튜터가 자기 컴퓨터에서 한 명씩 로컬로 검증하는 용도라 그 이상의 보호는
    불필요한 복잡도만 늘린다.
servers:
  - url: http://localhost:9090

paths:
  /admin/reset:
    post:
      operationId: resetPgMock
      summary: 처리 기록, 수신 로그, 스크립트 큐를 모두 초기화
      responses:
        '204':
          description: 초기화 완료

  /admin/script:
    post:
      operationId: scriptPgResponse
      summary: 특정 refundId의 다음 응답들을 순서대로 지정
      description: |
        지정한 refundId로 요청이 오면 steps를 앞에서부터 하나씩 소비해 그 결과로 응답한다.
        steps가 소진되면 이후에는 다시 가중치 랜덤으로 결정한다.
        단, 이미 성공(SUCCESS 또는 SLOW_BUT_PROCESSED)으로 결정된 refundId는 스크립트를 소비하지 않고
        항상 성공(이미 처리됨)으로 응답한다. (pg-mock.yaml의 요청 ID 인식 규칙이 우선)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refundId, steps]
              properties:
                refundId: { type: string }
                steps:
                  type: array
                  items:
                    type: string
                    enum: [SUCCESS, FAIL, ERROR, SLOW, SLOW_BUT_PROCESSED]
            examples:
              retryThenSucceed:
                summary: 실패 후 성공 (S9-a)
                value: { refundId: R-9001, steps: [FAIL, SUCCESS] }
              timeoutButProcessed:
                summary: 시간 초과인데 실제로는 처리됨 (S12, T1)
                value: { refundId: R-9002, steps: [SLOW_BUT_PROCESSED, SUCCESS] }
      responses:
        '204':
          description: 등록 완료

  /admin/requests:
    get:
      operationId: getPgRequestLog
      summary: 수신 로그 조회 (순서 판정 S11에 사용)
      responses:
        '200':
          description: 수신 순서대로 정렬된 로그
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [seq, refundId, orderId, amount, receivedAt, respondedAt, httpStatus, result]
                  properties:
                    seq: { type: integer }
                    refundId: { type: string }
                    orderId: { type: string }
                    amount: { type: integer }
                    receivedAt: { type: string, format: date-time }
                    respondedAt: { type: [string, 'null'], format: date-time }
                    httpStatus: { type: integer }
                    result: { type: [string, 'null'], enum: [SUCCESS, FAIL, null] }

  /admin/processed:
    get:
      operationId: getPgProcessed
      summary: 성공 처리된 환불 목록과 주문별 처리 건수 (이중 환불 여부 확인, S12/E1)
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                required: [items, countByOrder]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        refundId: { type: string }
                        orderId: { type: string }
                        amount: { type: integer }
                        processedAt: { type: string, format: date-time }
                  countByOrder:
                    type: object
                    description: '{ "ORD-2001": 1 } 형식. 같은 주문이 여러 번 처리되면 이중 환불 의심'
                    additionalProperties: { type: integer }
