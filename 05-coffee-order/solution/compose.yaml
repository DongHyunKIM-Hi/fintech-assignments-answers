# 정답 서버가 사용하는 MySQL과 Redis. 서버는 여러 대를 띄워도 이 둘을 함께 사용한다.
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: coffee
      TZ: Asia/Seoul
    ports:
      - "3306:3306"
    # docker compose up -d --wait 가 MySQL 준비가 끝날 때까지 기다리도록 상태 확인을 둔다
    healthcheck:
      test: ["CMD", "mysql", "-uroot", "-proot", "-e", "SELECT 1"]
      interval: 2s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7.4
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
